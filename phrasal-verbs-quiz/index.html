<meta charset="UTF-8">
<!-- Title tag below is read by the publish step -->
<title>Phrasal Verb Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #eef0e6;
    --paper-grain: #e7e9db;
    --surface: #fbfaf3;
    --surface-2: #f2f1e7;
    --ink: #232a1f;
    --ink-muted: #5c6455;
    --ink-faint: #8b917f;
    --accent: #2f5d8a;
    --accent-ink: #f8f8f3;
    --accent-soft: #dce6ef;
    --success: #3f7d4f;
    --success-bg: #e2eede;
    --danger: #b3492f;
    --danger-bg: #f5e2da;
    --border: #d7d8c6;
    --shadow: rgba(35, 42, 31, 0.10);
    --ribbon: #c98a3f;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #182420;
      --paper-grain: #1c2b25;
      --surface: #202f29;
      --surface-2: #253830;
      --ink: #ecebe1;
      --ink-muted: #a9b3a6;
      --ink-faint: #778077;
      --accent: #8bbbdd;
      --accent-ink: #16241d;
      --accent-soft: #2c3f45;
      --success: #8fc48a;
      --success-bg: #24392b;
      --danger: #e2917a;
      --danger-bg: #3a2620;
      --border: #33443c;
      --shadow: rgba(0, 0, 0, 0.35);
      --ribbon: #e0a85c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #182420;
    --paper-grain: #1c2b25;
    --surface: #202f29;
    --surface-2: #253830;
    --ink: #ecebe1;
    --ink-muted: #a9b3a6;
    --ink-faint: #778077;
    --accent: #8bbbdd;
    --accent-ink: #16241d;
    --accent-soft: #2c3f45;
    --success: #8fc48a;
    --success-bg: #24392b;
    --danger: #e2917a;
    --danger-bg: #3a2620;
    --border: #33443c;
    --shadow: rgba(0, 0, 0, 0.35);
    --ribbon: #e0a85c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 1px 1px, var(--paper-grain) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vw, 56px) 16px 64px;
  }

  .stage {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- Header ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .masthead h1 {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 1.9rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .masthead .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---------- Mode toggle ---------- */
  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .segmented {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .segmented button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    border: none;
    background: transparent;
    color: var(--ink-muted);
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .segmented button.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  @media (max-width: 560px) {
    .segmented { flex-wrap: wrap; border-radius: 12px; }
    .segmented button { flex: 1 1 auto; text-align: center; }
  }

  .deck-count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    letter-spacing: 0.03em;
  }

  /* ---------- Progress ---------- */
  .progress-track {
    height: 5px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--ribbon);
    width: 0%;
    transition: width 0.35s ease;
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: clamp(22px, 5vw, 34px);
    box-shadow: 0 10px 28px -14px var(--shadow);
  }

  .entry-no {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .prompt {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 4.6vw, 1.7rem);
    line-height: 1.35;
    text-wrap: balance;
    min-height: 3.4em;
    display: flex;
    align-items: center;
  }

  .prompt .quote-mark {
    font-style: normal;
    color: var(--ink-faint);
    font-size: 0.75em;
    margin-right: 2px;
  }

  .prompt.prompt-pic {
    justify-content: center;
  }
  .prompt img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: block;
    margin: 0 auto;
  }

  /* ---------- Options ---------- */
  .options {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
  }

  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: "Public Sans", sans-serif;
    font-size: 0.98rem;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .option:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .option .letter {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    font-weight: 600;
    width: 22px;
    height: 22px;
    flex: none;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
  }

  .option:disabled { cursor: default; }

  .option.correct {
    background: var(--success-bg);
    border-color: var(--success);
  }
  .option.correct .letter {
    background: var(--success);
    border-color: var(--success);
    color: var(--accent-ink);
  }

  .option.wrong {
    background: var(--danger-bg);
    border-color: var(--danger);
  }
  .option.wrong .letter {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--accent-ink);
  }

  .option.dim { opacity: 0.55; }

  /* ---------- Feedback / footer of card ---------- */
  .feedback-row {
    margin-top: 18px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .feedback-text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
  }
  .feedback-text.correct { color: var(--success); }
  .feedback-text.wrong { color: var(--danger); }

  .next-btn {
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .next-btn.show {
    visibility: visible;
    opacity: 1;
  }
  .next-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Stats ---------- */
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    padding: 0 4px;
  }
  .stats b {
    color: var(--ink);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .footer-row {
    display: flex;
    justify-content: center;
  }

  .restart-link {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 6px;
  }
  .restart-link:hover { color: var(--ink); }

  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- Back link ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
  }
  .back-link:hover { color: var(--ink); }

  /* ---------- Home view ---------- */
  .home-lede {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 1.02rem;
    color: var(--ink-muted);
    margin: 8px 0 0;
    max-width: 46ch;
    line-height: 1.5;
  }

  .option-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 560px) {
    .option-grid { grid-template-columns: 1fr; }
  }

  .option-card {
    display: flex;
    flex-direction: column;
    gap: 9px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 22px;
    cursor: pointer;
    box-shadow: 0 10px 28px -18px var(--shadow);
    transition: transform 0.14s ease, border-color 0.14s ease;
    font-family: inherit;
    color: inherit;
  }
  .option-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .option-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .oc-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .oc-title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: 1.32rem;
  }
  .oc-desc {
    font-size: 0.87rem;
    color: var(--ink-muted);
    line-height: 1.5;
  }
  .oc-cta {
    margin-top: auto;
    padding-top: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--ink-faint);
  }
  .option-card:hover .oc-cta { color: var(--accent); }

  /* ---------- Cases view ---------- */
  .sources-wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .source-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 28px -18px var(--shadow);
  }

  .source-image {
    display: block;
    width: 100%;
    cursor: zoom-in;
    border-bottom: 1px solid var(--border);
  }

  .source-head {
    padding: 18px 22px 2px;
  }
  .source-title {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: 1.28rem;
  }
  .source-sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 5px;
  }

  .source-body { padding: 8px 22px 22px; }

  .case-list { display: flex; flex-direction: column; }
  .case-entry {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .case-entry:last-child { border-bottom: none; padding-bottom: 4px; }
  .case-entry .num {
    flex: none;
    width: 20px;
    padding-top: 2px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
  }
  .case-entry .verb {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: 1.04rem;
  }
  .case-entry .def {
    margin-top: 2px;
    font-size: 0.89rem;
    color: var(--ink-muted);
  }
  .case-entry .example {
    margin-top: 5px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 0.87rem;
    color: var(--ink-faint);
  }

  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 6px;
  }
  .tag {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
  }
  .source-note {
    margin-top: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 8, 0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 10;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    cursor: zoom-out;
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 16px -8px var(--shadow);
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    z-index: 6;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-toggle svg { display: block; }
</style>

<div class="stage">
  <section id="view-home" class="view">
    <header class="masthead">
      <div>
        <h1>Phrasal Verb Drill for Gian Luca</h1>
        <p class="home-lede">One deck built from your CSV and the PNG images pulled from the repo's main branch.</p>
      </div>
    </header>

    <div class="option-grid">
      <button type="button" class="option-card" data-goto="quiz">
        <span class="oc-label">Quiz</span>
        <span class="oc-title">Run the Quiz New</span>
        <span class="oc-desc">156 phrasal verbs — the CSV plus new entries from Vacations.png — meaning ↔ verb, plus a 12-item picture round from Action Verbs.png.</span>
        <span class="oc-cta">Start drilling →</span>
      </button>
      <button type="button" class="option-card" data-goto="cases">
        <span class="oc-label">Reference</span>
        <span class="oc-title">Browse PNG Cases</span>
        <span class="oc-desc">Every case captured across the PNG images in the repo — verb, meaning, and example where available.</span>
        <span class="oc-cta">View entries →</span>
      </button>
    </div>
  </section>

  <section id="view-quiz" class="view" hidden>
    <button type="button" class="back-link" data-goto="home">← Home</button>

    <header class="masthead">
      <h1>Phrasal Verb Drill</h1>
      <span class="sub" id="deckLabel">156 entries</span>
    </header>

    <div class="mode-row">
      <div class="segmented" id="modeToggle" role="group" aria-label="Quiz direction">
        <button type="button" data-mode="def2verb" class="active">MEANING → VERB</button>
        <button type="button" data-mode="verb2def">VERB → MEANING</button>
        <button type="button" data-mode="pic2verb">PICTURE → VERB</button>
      </div>
      <span class="deck-count" id="roundLabel">round 1</span>
    </div>

    <div class="mode-row">
      <div class="segmented" id="lengthToggle" role="group" aria-label="Session length">
        <button type="button" data-length="10">10</button>
        <button type="button" data-length="20">20</button>
        <button type="button" data-length="all" class="active">ALL</button>
      </div>
      <span class="deck-count" id="sessionLabel"></span>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="card">
      <div class="entry-no" id="entryNo">entry 001</div>
      <div class="prompt" id="promptText"></div>

      <div class="options" id="optionsWrap"></div>

      <div class="feedback-row">
        <span class="feedback-text" id="feedbackText"></span>
        <button class="next-btn" id="nextBtn" type="button">Next →</button>
      </div>
    </div>

    <div class="stats">
      <span>score <b id="statScore">0/0</b></span>
      <span>streak <b id="statStreak">0</b></span>
      <span>best <b id="statBest">0</b></span>
    </div>

    <div class="footer-row">
      <button class="restart-link" id="restartBtn" type="button">restart deck</button>
    </div>
  </section>

  <section id="view-cases" class="view" hidden>
    <button type="button" class="back-link" data-goto="home">← Home</button>

    <header class="masthead">
      <h1>PNG Cases</h1>
      <span class="sub" id="casesCountLabel">21 entries · 2 images</span>
    </header>

    <div class="sources-wrap" id="sourcesWrap"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode"></button>

let activeView = "home";

function showView(name) {
  activeView = name;
  document.querySelectorAll(".view").forEach((v) => {
    v.hidden = v.id !== "view-" + name;
  });
  window.scrollTo(0, 0);
}

document.querySelectorAll("[data-goto]").forEach((b) => {
  b.addEventListener("click", () => showView(b.dataset.goto));
});

function renderSources() {
  els.sourcesWrap.innerHTML = "";
  let total = 0;

  SOURCES.forEach((src) => {
    total += src.entries.length;

    const card = document.createElement("div");
    card.className = "source-card";

    const img = document.createElement("img");
    img.className = "source-image";
    img.src = src.image;
    img.alt = src.title;
    img.loading = "lazy";
    img.addEventListener("click", () => openLightbox(src.image, src.title));
    card.appendChild(img);

    const head = document.createElement("div");
    head.className = "source-head";
    head.innerHTML =
      '<div class="source-title">' + escapeHtml(src.title) + '</div>' +
      '<div class="source-sub">' + escapeHtml(src.subtitle) + ' · ' + src.entries.length + ' cases</div>';
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "source-body";

    const hasDefs = src.entries.some((e) => e.def);
    if (hasDefs) {
      const list = document.createElement("div");
      list.className = "case-list";
      src.entries.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "case-entry";
        row.innerHTML =
          '<span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
          '<div class="body">' +
            '<div class="verb">' + escapeHtml(e.verb) + '</div>' +
            (e.def ? '<div class="def">' + escapeHtml(e.def) + '</div>' : '') +
            (e.example ? '<div class="example">“' + escapeHtml(e.example) + '”</div>' : '') +
          '</div>';
        list.appendChild(row);
      });
      body.appendChild(list);
    } else {
      const cloud = document.createElement("div");
      cloud.className = "tag-cloud";
      src.entries.forEach((e) => {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = e.verb;
        cloud.appendChild(tag);
      });
      body.appendChild(cloud);

      const note = document.createElement("div");
      note.className = "source-note";
      note.textContent = "Meaning shown visually in the image — no caption text to extract.";
      body.appendChild(note);
    }

    card.appendChild(body);
    els.sourcesWrap.appendChild(card);
  });

  els.casesCountLabel.textContent = total + " entries · " + SOURCES.length + " images";
}

function openLightbox(src, alt) {
  els.lightboxImg.src = src;
  els.lightboxImg.alt = alt;
  els.lightbox.classList.add("show");
}

function closeLightbox() {
  els.lightbox.classList.remove("show");
}

els.lightbox.addEventListener("click", closeLightbox);

/* ---------- Theme toggle ---------- */
const SUN_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>';

const themeToggle = document.getElementById("themeToggle");

function readStoredTheme() {
  try {
    const v = localStorage.getItem("pv-theme");
    return v === "light" || v === "dark" ? v : null;
  } catch (err) {
    return null;
  }
}

function writeStoredTheme(v) {
  try {
    localStorage.setItem("pv-theme", v);
  } catch (err) {
    /* storage unavailable — theme just won't persist across reloads */
  }
}

function effectiveTheme() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function updateToggleIcon() {
  const eff = effectiveTheme();
  themeToggle.innerHTML = eff === "dark" ? SUN_SVG : MOON_SVG;
  themeToggle.setAttribute("aria-label", eff === "dark" ? "Switch to light mode" : "Switch to dark mode");
}

function applyTheme(theme) {
  if (theme === "light" || theme === "dark") {
    document.documentElement.setAttribute("data-theme", theme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  updateToggleIcon();
}

themeToggle.addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  writeStoredTheme(next);
  applyTheme(next);
});

applyTheme(readStoredTheme());

els.deckLabel.textContent = pool.length + " entries";

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newDeck(announce) {
  const full = shuffle(pool.map((_, i) => i));
  const cap = sessionLength === "all" ? full.length : Math.min(Number(sessionLength), full.length);
  deck = full.slice(0, cap);
  pos = 0;
  els.roundLabel.textContent = "round " + round;
  els.sessionLabel.textContent = sessionLength === "all" ? "" : cap + "-verb session";
  if (announce) showToast("Deck reshuffled — round " + round);
}

function showToast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove("show"), 1800);
}

function letterFor(i) {
  return String.fromCharCode(65 + i);
}

function buildQuestion() {
  if (pos >= deck.length) {
    round += 1;
    newDeck(true);
  }
  const idx = deck[pos];
  const item = pool[idx];

  const distractorIdx = shuffle(
    pool.map((_, i) => i).filter((i) => i !== idx)
  ).slice(0, 3);

  const optionIdx = shuffle([idx, ...distractorIdx]);

  current = { idx, item, optionIdx };
  locked = false;

  els.entryNo.textContent = "entry " + String(pos + 1).padStart(3, "0") + " / " + deck.length;
  els.progressFill.style.width = ((pos) / deck.length * 100).toFixed(1) + "%";

  if (mode === "def2verb") {
    let html = '<span class="quote-mark">“</span>' + escapeHtml(item.def) + '<span class="quote-mark">”</span>';
    els.promptText.innerHTML = html;
    els.promptText.classList.remove("prompt-pic");
  } else if (mode === "pic2verb") {
    els.promptText.innerHTML = '<img src="' + item.image + '" alt="Illustration to guess">';
    els.promptText.classList.add("prompt-pic");
  } else {
    els.promptText.textContent = item.verb;
    els.promptText.classList.remove("prompt-pic");
  }

  els.optionsWrap.innerHTML = "";
  optionIdx.forEach((oi, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    btn.dataset.idx = oi;
    const label = mode === "verb2def" ? pool[oi].def : pool[oi].verb;
    btn.innerHTML = '<span class="letter">' + letterFor(i) + '</span><span>' + escapeHtml(label) + '</span>';
    btn.addEventListener("click", () => selectOption(oi, btn));
    els.optionsWrap.appendChild(btn);
  });

  els.feedbackText.textContent = "";
  els.feedbackText.className = "feedback-text";
  els.nextBtn.classList.remove("show");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function selectOption(oi, btn) {
  if (locked) return;
  locked = true;
  answered += 1;

  const isCorrect = oi === current.idx;
  const buttons = Array.from(els.optionsWrap.children);

  buttons.forEach((b) => {
    b.disabled = true;
    const bi = Number(b.dataset.idx);
    if (bi === current.idx) b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const detail = current.item.def
    ? current.item.verb + " · " + current.item.def + (current.item.example ? " — “" + current.item.example + "”" : "")
    : current.item.verb;

  if (isCorrect) {
    score += 1;
    streak += 1;
    best = Math.max(best, streak);
    els.feedbackText.textContent = "Correct — " + detail;
    els.feedbackText.classList.add("correct");
  } else {
    streak = 0;
    els.feedbackText.textContent = "Not quite — " + detail;
    els.feedbackText.classList.add("wrong");
  }

  els.progressFill.style.width = ((pos + 1) / deck.length * 100).toFixed(1) + "%";
  updateStats();
  els.nextBtn.classList.add("show");
  els.nextBtn.focus();
}

function updateStats() {
  els.statScore.textContent = score + "/" + answered;
  els.statStreak.textContent = streak;
  els.statBest.textContent = best;
}

function next() {
  pos += 1;
  buildQuestion();
}

els.nextBtn.addEventListener("click", next);

els.restartBtn.addEventListener("click", () => {
  round = 1;
  score = 0;
  answered = 0;
  streak = 0;
  best = 0;
  updateStats();
  newDeck(false);
  buildQuestion();
  showToast("Deck restarted");
});

els.modeToggle.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (!b || locked === undefined) return;
  if (b.dataset.mode === mode) return;
  mode = b.dataset.mode;
  pool = mode === "pic2verb" ? IMAGE_DATA : DATA;
  Array.from(els.modeToggle.children).forEach((c) => c.classList.toggle("active", c === b));
  els.deckLabel.textContent = pool.length + " entries";
  round = 1;
  score = 0;
  answered = 0;
  streak = 0;
  best = 0;
  updateStats();
  newDeck(false);
  buildQuestion();
});

els.lengthToggle.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-length]");
  if (!b) return;
  if (b.dataset.length === sessionLength) return;
  sessionLength = b.dataset.length;
  Array.from(els.lengthToggle.children).forEach((c) => c.classList.toggle("active", c === b));
  round = 1;
  score = 0;
  answered = 0;
  streak = 0;
  best = 0;
  updateStats();
  newDeck(false);
  buildQuestion();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && els.lightbox.classList.contains("show")) {
    closeLightbox();
    return;
  }
  if (activeView !== "quiz") return;
  if (["1", "2", "3", "4"].includes(e.key) && !locked) {
    const i = Number(e.key) - 1;
    const btn = els.optionsWrap.children[i];
    if (btn) btn.click();
  } else if ((e.key === "Enter" || e.key === " ") && els.nextBtn.classList.contains("show")) {
    e.preventDefault();
    next();
  }
});

newDeck(false);
buildQuestion();
updateStats();
renderSources();
</script>
